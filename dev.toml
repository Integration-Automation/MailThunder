# The dev channel, je_mail_thunder_dev. The publish-dev job of .github/workflows/test_dev.yml builds it by
# writing this file to pyproject.toml (scripts/dev_release.py). The version below is a floor: CI publishes
# one patch above the newest release on PyPI and commits nothing back.
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "je_mail_thunder_dev"
version = "0.0.40"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = ["je_action_core>=0.0.1"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://github.com/Integration-Automation/MailThunder"

[tool.setuptools.packages]
find = { namespaces = false }
