version: 2
updates:
  # Updates belong on dev: main is the released branch and merging into it
  # publishes.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
  # Workflow actions are pinned to commit SHAs with the version as a comment
  # (test_workflow_actions.py); Dependabot moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
