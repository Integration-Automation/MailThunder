name: Publish MailThunder Stable to PyPI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only; regenerate with
      #   uv pip compile .github/requirements/test.in --universal --python-version 3.10       #     --generate-hashes --only-binary :all: -o .github/requirements/test.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/test.txt

      # The package is standard library only; the tests import the checked-out source.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest test/unit_test/ --ignore=test/unit_test/manual_test -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # this job pushes
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Hash-locked, wheels-only; regenerate with
      #   uv pip compile .github/requirements/publish.in --generate-hashes --python-version 3.12       #     --python-platform x86_64-manylinux_2_28 --only-binary :all: -o .github/requirements/publish.txt
      - name: Install build tooling
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Bump patch version in pyproject.toml
        id: bump
        run: |
          python - <<'PY'
          import os
          import tomli
          import tomli_w

          path = "pyproject.toml"
          with open(path, "rb") as handle:
              data = tomli.load(handle)

          current = data["project"]["version"]
          major, minor, patch = (int(part) for part in current.split("."))
          patch += 1
          new_version = f"{major}.{minor}.{patch}"
          data["project"]["version"] = new_version

          with open(path, "wb") as handle:
              tomli_w.dump(data, handle)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"old_version={current}\n")
              out.write(f"new_version={new_version}\n")

          print(f"Bumped version: {current} -> {new_version}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump stable version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --notes "Automated stable release for v${{ steps.bump.outputs.new_version }}. Published to PyPI as \`je-mail-thunder==${{ steps.bump.outputs.new_version }}\`." \
            --target main \
            dist/*
