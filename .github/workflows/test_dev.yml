name: MailThunder Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only; regenerate with
      #   uv pip compile .github/requirements/test.in --universal --python-version 3.10       #     --generate-hashes --only-binary :all: -o .github/requirements/test.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/test.txt

      # The package is standard library only; the tests import the checked-out source.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest test/unit_test/ --ignore=test/unit_test/manual_test -v
