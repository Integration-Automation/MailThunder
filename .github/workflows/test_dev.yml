name: MailThunder Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # about 3x the slowest recent run, at least 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only; regenerate with
      #   uv pip compile .github/requirements/test.in --universal --python-version 3.10       #     --generate-hashes --only-binary :all: -o .github/requirements/test.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/test.txt

      # The package is standard library only; the tests import the checked-out source.
      # je_action_core has no dependencies and is not on PyPI yet (ActionCore progress.md #1), so it cannot be
      # in the hash-locked requirements; install it from GitHub at a fixed commit until it is.
      - name: Install je_action_core
        run: |
          pip install --no-deps "je_action_core @ git+https://github.com/Integration-Automation/ActionCore@6cbc1869863efe784f459a9707e298b5a9386db5"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest test/unit_test/ --ignore=test/unit_test/manual_test -v
