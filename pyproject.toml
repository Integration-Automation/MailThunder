# Stable channel: the je_mail_thunder package. dev.toml builds je_mail_thunder_dev.
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_mail_thunder"
version = "0.0.24"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
# Standard library only (smtplib, imaplib, email, socketserver).
dependencies = []
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://github.com/Integration-Automation/MailThunder"

[tool.setuptools.packages]
find = { namespaces = false }

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.bandit]
exclude_dirs = ["test"]
skips = ["B101"]
